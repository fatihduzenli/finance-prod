<h2 id="collections">Collection e-mails</h2>
{% include "ledger/collections/_log.html" with log=collection_log show_charge=False %}
{% if can_send_message %}
  <form method="post" action="{{ send_message_url }}" class="actions js-single-submit" id="send-message">
    {% csrf_token %}
    <label for="send-message-select">Send a message now</label>
    <select name="template" id="send-message-select">
      {% for template in message_templates %}<option value="{{ template.pk }}">{{ template.display_name }}</option>{% endfor %}
    </select>
    <button class="btn" type="submit">Send</button>
  </form>
{% endif %}
