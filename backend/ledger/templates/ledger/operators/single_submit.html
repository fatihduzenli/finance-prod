{% comment %}
Disables a form's submit button (the one pressed) on the first submission, so a double
click sends one request. A convenience only: the server refuses a repeat by itself
(PLAN-006 D6).
{% endcomment %}
<script>
  document.querySelectorAll("form.js-single-submit").forEach(function (form) {
    form.addEventListener("submit", function (event) {
      if (form.dataset.submitted) { event.preventDefault(); return; }
      form.dataset.submitted = "1";
      var button = event.submitter || form.querySelector("button[type=submit]");
      if (button) { button.disabled = true; }
    });
  });
</script>
