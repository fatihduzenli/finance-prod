{% if transfer %}
<form method="post" action="{% url 'ledger:transfers:cancel' pk=transfer.pk %}" id="transfer-cancel" class="js-single-submit">
  {% csrf_token %}
  <p class="actions"><button class="btn" type="submit">Cancel the transfer</button> <span class="muted">Deletes this transfer and its lease end draft; nothing else changes.</span></p>
</form>
{% else %}
<form method="post" action="{% url 'ledger:lease_ends:cancel' pk=end.pk %}" id="lease-end-cancel" class="js-single-submit">
  {% csrf_token %}
  <p class="actions"><button class="btn" type="submit">Cancel the lease end</button> <span class="muted">Deletes this draft; nothing else changes.</span></p>
</form>
{% endif %}
