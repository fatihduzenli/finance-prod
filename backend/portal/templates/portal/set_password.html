{% extends "portal/base.html" %}
{% block title %}Choose your password{% endblock %}
{% block content %}
<section class="portal-card portal-narrow">
  <h1>Choose your password</h1>
  <p>Your portal account is <strong id="link-email">{{ email }}</strong>. Choose a password to sign in with.</p>
  <form method="post" id="set-password-form">{% csrf_token %}
    {% include "portal/_password_fields.html" %}
    <button type="submit" class="portal-button">Save and sign in</button>
  </form>
</section>
{% endblock %}
