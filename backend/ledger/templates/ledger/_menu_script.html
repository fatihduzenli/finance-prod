{% comment %}
Closes an open bar menu (details.menu, docs/qa/PLAN-012e2-fewer-actions.md D5) on a click
outside it and on Escape. A convenience only: without it the menu opens and closes with its
summary.
{% endcomment %}
<script>
  (function () {
    var menus = Array.prototype.slice.call(document.querySelectorAll("details.menu"));
    if (!menus.length) { return; }
    document.addEventListener("click", function (event) {
      menus.forEach(function (menu) {
        if (menu.open && !menu.contains(event.target)) { menu.open = false; }
      });
    });
    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape") { return; }
      menus.forEach(function (menu) {
        if (!menu.open) { return; }
        menu.open = false;
        menu.querySelector("summary").focus();
      });
    });
  })();
</script>
