{% if problems %}<ul class="portal-error" id="password-problems" role="alert">{% for problem in problems %}<li>{{ problem }}</li>{% endfor %}</ul>{% endif %}
<label for="new-password">New password</label>
<input id="new-password" type="password" name="password" autocomplete="new-password" required>
<label for="confirm-password">The new password again</label>
<input id="confirm-password" type="password" name="confirm" autocomplete="new-password" required>
