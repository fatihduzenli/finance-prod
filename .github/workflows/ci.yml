name: CI

# Every push and every pull request runs the full check suite from
# docs/qa/PLAN-002-scaffolding.md section 3. Pushes to main additionally deploy
# the staging environment. Deployment is a Publish action under root CLAUDE.md
# section 6: it runs only from CI, after the test job, and only for main.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer commit on the same ref supersedes an in-flight run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks that need no database: lint, format, strict types and the secret scan of the
  # browser-served assets. About a minute; every other job runs beside it.
  checks:
    name: Lint, types and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Placeholder values only. STAX_API_KEY is a fake string that the secret
      # scan looks for in browser-served assets; it is not a credential and
      # reaches no Stax endpoint.
      APP_ENV: local
      STAX_ENV: sandbox
      STAX_API_BASE_URL: https://apiprod.fattlabs.com
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres@localhost:5432/finance_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      STAX_API_KEY: FAKE-CI-KEY-XYZ123

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Secret scan of browser-served assets
        run: bash scripts/check-no-secrets.sh

  # The unit tests on PostgreSQL in two parallel halves (2026-10-22: one step of 12 to 19
  # minutes depending on the runner, against a 20-minute limit). Half A is the test files
  # named test_a… to test_l… (3,688 tests on 2026-10-22); half B is everything else under
  # backend/tests (3,186), through --ignore-glob of half A's files, so the subfolders
  # (sandbox, visual: deselected by their markers) stay covered. Both halves leave out the
  # seeded migration tests, which are the "Migration tests" job: every test in the
  # "not e2e" set runs in exactly one of the three jobs.
  #
  # A test that runs longer than five minutes dumps every thread's stack and the step ends
  # at its limit, so a hang names its test instead of using the whole job timeout (CI run
  # of 2026-10-05, QA-010b addendum).
  unit-a:
    name: Unit tests A (test_a to test_l)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: postgres
          # Trust auth on a throwaway CI database, deliberately, so that no
          # password literal and no credential-bearing connection string
          # appears anywhere in this workflow (root CLAUDE.md 5.2).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Placeholder values only. STAX_API_KEY is a fake string that the secret
      # scan looks for in browser-served assets; it is not a credential and
      # reaches no Stax endpoint.
      APP_ENV: local
      STAX_ENV: sandbox
      STAX_API_BASE_URL: https://apiprod.fattlabs.com
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres@localhost:5432/finance_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      STAX_API_KEY: FAKE-CI-KEY-XYZ123

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Unit tests, half A
        timeout-minutes: 20
        run: >-
          uv run pytest -m "not e2e" -q -o faulthandler_timeout=300
          backend/tests/test_[a-l]*.py
          --ignore=backend/tests/test_migrations_roundtrip.py
          --ignore=backend/tests/test_report_indexes.py
          --deselect "backend/tests/test_one_off_charges.py::test_the_rename_migration_rewrites_rows_and_reverses"
          --deselect "backend/tests/test_one_off_charges.py::test_the_rename_migration_refuses_to_reverse_over_a_one_off_charge"
          --deselect "backend/tests/test_staging_defects_adversarial.py::test_two_concurrent_runs_both_succeed_and_migrate_once"

  unit-b:
    name: Unit tests B (the rest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: postgres
          # Trust auth on a throwaway CI database, deliberately, so that no
          # password literal and no credential-bearing connection string
          # appears anywhere in this workflow (root CLAUDE.md 5.2).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Placeholder values only. STAX_API_KEY is a fake string that the secret
      # scan looks for in browser-served assets; it is not a credential and
      # reaches no Stax endpoint.
      APP_ENV: local
      STAX_ENV: sandbox
      STAX_API_BASE_URL: https://apiprod.fattlabs.com
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres@localhost:5432/finance_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      STAX_API_KEY: FAKE-CI-KEY-XYZ123

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Unit tests, half B
        timeout-minutes: 20
        run: >-
          uv run pytest -m "not e2e" -q -o faulthandler_timeout=300
          backend/tests
          --ignore-glob="backend/tests/test_[a-l]*.py"
          --ignore=backend/tests/test_migrations_roundtrip.py
          --ignore=backend/tests/test_report_indexes.py
          --deselect "backend/tests/test_one_off_charges.py::test_the_rename_migration_rewrites_rows_and_reverses"
          --deselect "backend/tests/test_one_off_charges.py::test_the_rename_migration_refuses_to_reverse_over_a_one_off_charge"
          --deselect "backend/tests/test_staging_defects_adversarial.py::test_two_concurrent_runs_both_succeed_and_migrate_once"

  # The end-to-end tests inside the Playwright image of the installed Playwright version:
  # Chromium and its system packages are in the image, so nothing is downloaded per run
  # (2026-10-22: "playwright install --with-deps" took 12 minutes on a slow runner, 22
  # seconds on a normal one). The same image the visual job compares in.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Placeholder values only. STAX_API_KEY is a fake string that the secret
      # scan looks for in browser-served assets; it is not a credential and
      # reaches no Stax endpoint.
      APP_ENV: local
      STAX_ENV: sandbox
      STAX_API_BASE_URL: https://apiprod.fattlabs.com
      APP_BASE_URL: http://localhost:8000
      # Inside a job container the service is reached by its name.
      DATABASE_URL: postgresql://postgres@postgres:5432/finance_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      STAX_API_KEY: FAKE-CI-KEY-XYZ123

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: End-to-end tests
        run: uv run pytest -m e2e -q -o faulthandler_timeout=300

  migrations:
    # The seeded migration round trips (PLAN-012b-a part 1): every migration applied and
    # reversed on PostgreSQL, apart from the unit tests and in parallel with them. Measured
    # 8 to 12 minutes; the limit leaves room for a slow runner.
    name: Migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      STAX_ENV: sandbox
      STAX_API_BASE_URL: https://apiprod.fattlabs.com
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres@localhost:5432/finance_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      STAX_API_KEY: FAKE-CI-KEY-XYZ123

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Migration tests
        run: >-
          uv run pytest -m "not e2e" -q -o faulthandler_timeout=300
          backend/tests/test_migrations_roundtrip.py
          backend/tests/test_report_indexes.py
          "backend/tests/test_one_off_charges.py::test_the_rename_migration_rewrites_rows_and_reverses"
          "backend/tests/test_one_off_charges.py::test_the_rename_migration_refuses_to_reverse_over_a_one_off_charge"
          "backend/tests/test_staging_defects_adversarial.py::test_two_concurrent_runs_both_succeed_and_migrate_once"

  visual:
    # PLAN-012c D10: the ten pages at two widths against the committed baselines
    # (backend/tests/visual/baseline/). The job runs inside the Playwright image of the
    # installed Playwright version, the same image Fable generates the baselines in, so the
    # fonts and the Chromium build match pixel for pixel. A difference fails the job and the
    # diff images are kept as an artifact for review.
    name: Visual regression
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      STAX_ENV: sandbox
      STAX_API_BASE_URL: https://apiprod.fattlabs.com
      APP_BASE_URL: http://localhost:8000
      # Inside a job container the service is reached by its name.
      DATABASE_URL: postgresql://postgres@postgres:5432/finance_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      STAX_API_KEY: FAKE-CI-KEY-XYZ123

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Compare the pages with the baselines
        run: uv run pytest backend/tests/visual -m visual -q -o faulthandler_timeout=300

      - name: Keep the diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: backend/tests/visual/out/
          if-no-files-found: ignore

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks, unit-a, unit-b, migrations, e2e, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging

    permissions:
      # Federated (OIDC) sign-in to Azure. No client secret is stored.
      id-token: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the image in Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          az acr build --registry "$ACR_NAME" --image "finance-web:$IMAGE_TAG" .

      # Each update tolerates an error (owner request of 2026-10-02, PLAN-010 D13): the
      # command can report a transient failure for a revision that does go live. The
      # verification step below decides from the revisions themselves.
      - name: Roll the web container app onto the new image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          WEB_APP_NAME: ${{ vars.WEB_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/finance-web:$IMAGE_TAG" \
            || echo "update returned an error; verifying the revision instead"

      # The web revision applies the migrations when it starts (deploy_migrate), so the
      # worker, the reconcile job and the daily job move to the new image only once an
      # active web revision on this commit is Healthy and Running: new code never runs
      # against the old schema (staging incident of 2026-10-06). Read-only az query, the
      # live() of the verification step below; after 10 minutes the job fails here and
      # none of the three is updated.
      - name: Wait for the web revision to be live on this commit
        env:
          WEB_APP_NAME: ${{ vars.WEB_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          live() {
            az containerapp revision list \
              --name "$1" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active && ends_with(properties.template.containers[0].image, ':$IMAGE_TAG') && properties.healthState == 'Healthy' && starts_with(properties.runningState, 'Running')] | length(@)" \
              --output tsv 2>/dev/null || echo 0
          }
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            web="$(live "$WEB_APP_NAME")"
            echo "live web revisions on $IMAGE_TAG: ${web:-0}"
            if [ "${web:-0}" -ge 1 ]; then
              echo "web runs this commit, Healthy and Running; rolling the worker and the reconcile job"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "the web revision on this commit is not live after 10 minutes; the worker and the reconcile job were not updated" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Roll the worker container app onto the new image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME || 'finance-staging-worker' }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WORKER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/finance-web:$IMAGE_TAG" \
            || echo "update returned an error; verifying the revision instead"

      # The scheduled reconciliation job (PLAN-010 D5, D13) runs the same image; the next
      # firing after this update uses it. Same tolerance as the other two updates.
      - name: Roll the reconcile job onto the new image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RECONCILE_JOB_NAME: ${{ vars.RECONCILE_JOB_NAME || 'finance-staging-reconcile' }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          az containerapp job update \
            --name "$RECONCILE_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/finance-web:$IMAGE_TAG" \
            || echo "update returned an error; verifying the revision instead"

      # The daily collections job (PLAN-011b D8, D9) runs the same image too, rolled after
      # the reconcile job with the same tolerance; its next firing uses the new image.
      - name: Roll the daily job onto the new image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          DAILY_JOB_NAME: ${{ vars.DAILY_JOB_NAME || 'finance-staging-daily' }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          az containerapp job update \
            --name "$DAILY_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/finance-web:$IMAGE_TAG" \
            || echo "update returned an error; verifying the revision instead"

      # Read-only az queries. Passes only when, for both apps, an active revision runs
      # the image tagged with this commit and reports Healthy and Running (a running
      # state that starts with Running, so RunningAtMaxScale of the one-replica worker
      # counts), and the reconcile and daily jobs' templates name the image tagged with
      # this commit (a job has no revisions); polls for up to 10 minutes, then fails.
      - name: Verify the web and worker revisions are live on this commit
        env:
          WEB_APP_NAME: ${{ vars.WEB_APP_NAME }}
          WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME || 'finance-staging-worker' }}
          RECONCILE_JOB_NAME: ${{ vars.RECONCILE_JOB_NAME || 'finance-staging-reconcile' }}
          DAILY_JOB_NAME: ${{ vars.DAILY_JOB_NAME || 'finance-staging-daily' }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          live() {
            az containerapp revision list \
              --name "$1" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active && ends_with(properties.template.containers[0].image, ':$IMAGE_TAG') && properties.healthState == 'Healthy' && starts_with(properties.runningState, 'Running')] | length(@)" \
              --output tsv 2>/dev/null || echo 0
          }
          job_on_commit() {
            image="$(az containerapp job show \
              --name "$1" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" \
              --output tsv 2>/dev/null || true)"
            case "$image" in
              *":$IMAGE_TAG") echo 1 ;;
              *) echo 0 ;;
            esac
          }
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            web="$(live "$WEB_APP_NAME")"
            worker="$(live "$WORKER_APP_NAME")"
            job="$(job_on_commit "$RECONCILE_JOB_NAME")"
            daily="$(job_on_commit "$DAILY_JOB_NAME")"
            echo "live revisions on $IMAGE_TAG: web=${web:-0} worker=${worker:-0} reconcile job=${job} daily job=${daily}"
            if [ "${web:-0}" -ge 1 ] && [ "${worker:-0}" -ge 1 ] && [ "$job" -eq 1 ] && [ "$daily" -eq 1 ]; then
              echo "web and worker run this commit, Healthy and Running; the reconcile and daily jobs use it"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "a revision on this commit is not live after 10 minutes, or the reconcile or daily job does not use it" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test the health endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail
          # Whitespace is stripped before matching so the assertion holds
          # whichever JSON separators the response uses.
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --max-time 10 "$APP_BASE_URL/healthz" || true)"
            compact="$(printf '%s' "$body" | tr -d ' \t\r\n')"
            case "$compact" in
              *'"stax_env":"sandbox"'*)
                echo "healthz reports the sandbox environment"
                exit 0
                ;;
            esac
            echo "attempt $attempt: revision not serving the expected payload yet"
            sleep 10
          done
          echo "healthz never reported stax_env=sandbox" >&2
          exit 1
