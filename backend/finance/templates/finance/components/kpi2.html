{% load icons %}<div class="kpi2"><div class="kpi2-head"><span class="kpi2-icon" aria-hidden="true">{% icon icon 16 %}</span><div class="kpi2-titles"><p class="kpi2-title">{{ title }}</p>{% if sub %}<p class="kpi2-sub">{{ sub }}</p>{% endif %}</div></div><div class="kpi2-amount"><span class="kpi2-value{% if value_tone %} tone-{{ value_tone }}{% endif %}{% if value_class %} {{ value_class }}{% endif %}"{% if value_id %} id="{{ value_id }}"{% endif %}{{ value_attrs }}>{{ value }}</span>{% if badge %}<span class="kpi2-pill kpi2-pill-{{ badge_tone }}">{{ badge }}</span>{% endif %}</div>{% if link %}<a class="kpi2-link" href="{{ link }}"{% if link_id %} id="{{ link_id }}"{% endif %}><span>{{ link_text }}</span>{% icon "arrow-right" 16 %}</a>{% endif %}</div>
