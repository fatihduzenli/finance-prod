{% comment %}The range form of a ranged report: "action" (the page), "export" (its CSV route), "selected" (a reports.ReportRange) and "export_query".{% endcomment %}<form method="get" action="{{ action }}" id="report-filters" role="search">
    <div class="actions">
      <label for="from" style="margin:0;">From</label>
      <input type="month" name="from" id="from" value="{{ selected.from_month|date:'Y-m' }}">
      <label for="to" style="margin:0;">To</label>
      <input type="month" name="to" id="to" value="{{ selected.to_month|date:'Y-m' }}">
      <button class="btn" type="submit">Show</button>
      <a class="btn" id="export-csv" href="{{ export }}?{{ export_query }}">Export CSV</a>
    </div>
  </form>
  {% if selected.messages %}
    <ul class="messages" id="report-messages">{% for text in selected.messages %}<li class="warning" role="status">{{ text }}</li>{% endfor %}</ul>
  {% endif %}
